services:
  - type: web
    name: job-queue-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: job-queue-db
    databaseName: jobqueue
    user: jobqueue
    plan: free
